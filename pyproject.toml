[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmaps-cli"
version = "0.1.0"
description = "Zero-dependency Google Maps CLI (Places New, Geocoding v4, Routes) with agent-friendly JSON output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gianluca D'Intino-Conte" }]
keywords = ["google-maps", "places", "geocoding", "routes", "cli", "agent"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/gldc/gmaps-cli"
Issues = "https://github.com/gldc/gmaps-cli/issues"

[project.scripts]
gmaps = "gmaps:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
only-include = ["gmaps.py"]

[tool.hatch.build.targets.sdist]
include = ["gmaps.py", "tests/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
